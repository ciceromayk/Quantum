[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum"
version = "0.1.0"
description = "Levantamento de quantitativos e orçamento a partir de arquivos DWG/DXF, com agentes por disciplina."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quantum = "quantum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
