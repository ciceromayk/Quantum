[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum"
version = "0.1.0"
description = "Levantamento de quantitativos e orçamento a partir de arquivos DWG/DXF, com agentes por disciplina."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
    "psycopg[binary]>=3.1",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
quantum = "quantum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum", "src/quantum_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
